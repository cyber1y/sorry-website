<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sorry 💛</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      font-family: 'Baloo 2', 'Segoe UI', 'Comic Sans MS', ui-rounded, sans-serif;
      color: #4a2050;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px 32px;
      background: linear-gradient(160deg, #ffd7e4 0%, #ffe9f2 35%, #ffddf0 70%, #ffc9e2 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    .card { position: relative; width: 100%; max-width: 440px; background: rgba(255,255,255,0.6);
      border: 3px solid #fff; border-radius: 36px; box-shadow: 0 24px 60px rgba(214,90,140,0.35);
      padding: 34px 28px 30px; text-align: center; animation: pop 0.6s cubic-bezier(.2,1.6,.4,1); backdrop-filter: blur(6px); }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes drift { 0% { transform: translateY(8vh) scale(.7); opacity: 0; } 15% { opacity: .85; } 100% { transform: translateY(-102vh) scale(1.05); opacity: 0; } }
    .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .hearts span { position: absolute; bottom: -40px; font-size: 26px; animation: drift linear infinite; animation-duration: 7s; }
    .kicker { display: inline-block; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #d06a9a;
      background: #fff; border-radius: 999px; padding: 6px 16px; box-shadow: 0 6px 16px rgba(214,90,140,.2); margin-bottom: 14px; }
    h1 { font-size: 44px; line-height: 1.05; margin: 0 0 6px; background: linear-gradient(90deg,#e8578f,#b05bd9,#ff8fa8,#e8578f);
      background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: hue 6s linear infinite; }
    @keyframes hue { to { background-position: 300% 0; } }
    .sub { color: #8a4f75; font-size: 15px; margin-bottom: 20px; font-weight: 600; }
    .bear { width: 100%; max-width: 290px; margin: 0 auto 6px; border-radius: 24px; animation: bob 2.6s ease-in-out infinite; }
    .qr { margin: 10px auto 4px; width: 230px; padding: 14px; background: #fffafc; border-radius: 24px;
      border: 3px solid #ffd7e4; box-shadow: 0 10px 24px rgba(214,90,140,.25); display: inline-block; }
    .qr img { width: 100%; display: block; }
    .scan { font-size: 13px; color: #d06a9a; font-weight: 700; letter-spacing: 1px; margin-top: 10px; }
    .note { margin-top: 18px; font-size: 12.5px; color: #a2688c; line-height: 1.5; word-break: break-all; }
    @media (min-width: 520px) { .bear { max-width: 260px; } }
  </style>
</head>

    <div class="kicker">💌 A little message for you</div>
